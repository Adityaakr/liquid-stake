<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide app — stake VARA</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{background:var(--bg-page);overflow-x:hidden}
.ap-row{transition:background var(--dur-1) var(--ease-out)}
.ap-row:hover{background:rgba(163,164,255,.05)}
.ap-row td{border-top:1px solid var(--line-1)}
.ap-row:first-child td{border-top:none}
.ap-nav:hover{background:rgba(163,164,255,.06)!important;color:var(--text-1)!important}
.ap-stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 22%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 78% 15%,rgba(255,255,255,.28),transparent),radial-gradient(1.2px 1.2px at 55% 45%,rgba(220,200,255,.3),transparent),radial-gradient(1px 1px at 30% 70%,rgba(255,255,255,.22),transparent),radial-gradient(1.4px 1.4px at 88% 60%,rgba(220,200,255,.28),transparent),radial-gradient(1px 1px at 65% 85%,rgba(255,255,255,.25),transparent)}
.ap-pulse{position:relative}
.ap-pulse::after{content:'';position:absolute;inset:-3px;border-radius:99px;border:1.5px solid rgba(163,164,255,.55);animation:appulse 2.4s var(--ease-out) infinite}
@keyframes appulse{0%{transform:scale(.92);opacity:.9}70%{transform:scale(1.55);opacity:0}100%{transform:scale(1.55);opacity:0}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="StakeView.jsx"></script>
<script type="text/babel" src="VaultsView.jsx"></script>
<script type="text/babel" src="PortfolioView.jsx"></script>
<script type="text/babel">
const {Toast}=window.TideDesignSystem_f6b246;
const {APP,Sidebar,TopBar,StakeView,VaultsView,PortfolioView}=window;
const TITLES={stake:["Stake"],vaults:["Stable vaults"],portfolio:["Portfolio"]};
function App(){
const[view,setView]=React.useState("stake");
const[connected,setConnected]=React.useState(false);
const[bal,setBal]=React.useState({...APP.balances,unbonding:0});
const[toast,setToast]=React.useState(null);
const notify=t=>{setToast(t);window.clearTimeout(window.__tideT);window.__tideT=setTimeout(()=>setToast(null),5200);};
const onConnect=()=>{setConnected(true);notify({tone:"ok",title:"Wallet connected",detail:APP.wallet+" · Vara mainnet"});};
React.useEffect(()=>{if(window.lucide)lucide.createIcons();},[view]);
return <div style={{display:"flex",minHeight:"100vh",position:"relative"}}>
<div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0}}>
<div style={{position:"absolute",left:"55%",top:-260,transform:"translateX(-50%)",width:1000,height:520,background:"radial-gradient(closest-side,rgba(139,140,255,.16),transparent)",filter:"blur(26px)"}}/>
<div style={{position:"absolute",right:-160,bottom:-200,width:640,height:480,background:"radial-gradient(closest-side,rgba(139,140,255,.10),transparent)",filter:"blur(24px)"}}/>
<div style={{position:"absolute",inset:0,backgroundImage:"var(--dot-grid)",backgroundSize:"var(--dot-grid-size)",opacity:.4,maskImage:"radial-gradient(760px 380px at 60% 0%,#000 20%,transparent)",WebkitMaskImage:"radial-gradient(760px 380px at 60% 0%,#000 20%,transparent)"}}/>
</div>
<Sidebar view={view} setView={setView}/>
<main style={{flex:1,minWidth:0,position:"relative",zIndex:1}}>
<TopBar title={TITLES[view][0]} sub={TITLES[view][1]} connected={connected} onConnect={onConnect}/>
<div style={{padding:"28px 30px 56px",maxWidth:1180,margin:"0 auto"}}>
{view==="stake"&&<StakeView bal={bal} setBal={setBal} notify={notify} connected={connected} onConnect={onConnect}/>}
{view==="vaults"&&<VaultsView bal={bal} setBal={setBal} notify={notify} connected={connected} onConnect={onConnect}/>}
{view==="portfolio"&&<PortfolioView bal={bal} setView={setView}/>}
</div></main>
{toast&&<Toast floating tone={toast.tone} title={toast.title} detail={toast.detail} onDismiss={()=>setToast(null)}/>}
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
